name: Build and deploy to GCP

# Runs on every push to main (after merging a PR) or manually.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # Workload Identity Federation: no long-lived GCP keys in GitHub

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/${{ vars.AR_REPO }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest backend/tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run lint && npm test
        working-directory: frontend

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Docker login to Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          build-args: |
            WHISPER_MODEL=${{ vars.WHISPER_MODEL || 'base' }}
          tags: |
            ${{ env.REGISTRY }}/backend:${{ github.sha }}
            ${{ env.REGISTRY }}/backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=/api
          tags: |
            ${{ env.REGISTRY }}/web:${{ github.sha }}
            ${{ env.REGISTRY }}/web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Copy compose files to the VM
        run: |
          gcloud compute scp --zone "${{ vars.GCP_ZONE }}" --tunnel-through-iap \
            docker-compose.yml docker-compose.gpu.yml \
            "${{ vars.GCP_VM_NAME }}":/tmp/

      - name: Roll out on the VM
        run: |
          gcloud compute ssh "${{ vars.GCP_VM_NAME }}" --zone "${{ vars.GCP_ZONE }}" --tunnel-through-iap --command '
            set -euo pipefail
            sudo mkdir -p /opt/video-agent
            sudo mv /tmp/docker-compose.yml /tmp/docker-compose.gpu.yml /opt/video-agent/
            cd /opt/video-agent
            test -f .env || { echo "Missing /opt/video-agent/.env (see .env.example)"; exit 1; }
            sudo sed -i "s|^TAG=.*|TAG=${{ github.sha }}|" .env
            FILES="-f docker-compose.yml"
            if command -v nvidia-smi >/dev/null 2>&1; then FILES="$FILES -f docker-compose.gpu.yml"; fi
            sudo docker compose $FILES --profile cloudsql pull
            sudo docker compose $FILES --profile cloudsql up -d --remove-orphans
            sudo docker image prune -f
          '

      - name: Smoke test
        run: |
          gcloud compute ssh "${{ vars.GCP_VM_NAME }}" --zone "${{ vars.GCP_ZONE }}" --tunnel-through-iap --command '
            for i in $(seq 1 30); do
              if curl -fsS http://localhost/api/healthz >/dev/null; then echo "backend healthy"; exit 0; fi
              sleep 5
            done
            echo "backend did not become healthy"; sudo docker compose -f /opt/video-agent/docker-compose.yml logs --tail 80 backend; exit 1
          '
